name: Update top downloads

on:
  push:
    branches: [main]
    paths:
      - "games/**/README.md"
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-top-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh ranking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_top_downloads.py

      - name: Commit changed rankings
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Rankings are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update localization download rankings"
          git push
